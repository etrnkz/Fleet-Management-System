# Render.com blueprint — create a Web Service from this repo.
# After first deploy, set environment variables in the Render dashboard
# (DB_*, REDIS_*, JWT_*, EMAIL_*, etc.) to match Backend/.env.example.
#
# Docs: https://render.com/docs/yaml-spec

services:
  - type: web
    name: fleet-management-api
    runtime: docker
    dockerfilePath: ./Backend/Dockerfile
    dockerContext: ./Backend
    plan: free
    region: oregon
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3000"
