apiVersion: v1
kind: Service
metadata:
  name: backend
  labels:
    app: fleet-management
    component: backend
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.backendPort }}
      targetPort: {{ .Values.service.backendPort }}
      protocol: TCP
      name: http
  selector:
    app: fleet-management
    component: backend
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  labels:
    app: fleet-management
    component: frontend
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.frontendPort }}
      targetPort: {{ .Values.service.frontendPort }}
      protocol: TCP
      name: http
  selector:
    app: fleet-management
    component: frontend
