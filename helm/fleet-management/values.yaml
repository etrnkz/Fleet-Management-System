replicaCount:
  backend: 2
  frontend: 2

image:
  backend:
    repository: fleet-management-backend
    tag: latest
    pullPolicy: IfNotPresent
  frontend:
    repository: fleet-management-frontend
    tag: latest
    pullPolicy: IfNotPresent

service:
  type: ClusterIP
  backendPort: 3000
  frontendPort: 3000

ingress:
  enabled: true
  className: nginx
  hosts:
    - host: fleet.local
      paths:
        - path: /api
          pathType: Prefix
          serviceName: backend
          servicePort: 3000
        - path: /
          pathType: Prefix
          serviceName: frontend
          servicePort: 3000
  tls: []

postgres:
  host: postgres
  port: 5432
  database: fleet_management
  existingSecret: fleet-db-secret

redis:
  host: redis
  port: 6379

jwt:
  existingSecret: fleet-jwt-secret

env:
  NODE_ENV: production
  FRONTEND_URL: http://localhost
  LOG_LEVEL: warn

resources:
  backend:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  frontend:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70

nodeSelector: {}
tolerations: []
affinity: {}
