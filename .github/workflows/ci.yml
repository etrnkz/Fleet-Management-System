name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Backend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run lint
      - name: Start PostgreSQL
        uses: harmonia-io/wait-for-postgres-action@v1
        with:
          postgres-user: postgres
          postgres-password: postgres
          postgres-db: fleet_test
      - name: Run migrations
        run: npm run migration:run
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USERNAME: postgres
          DB_PASSWORD: postgres
          DB_DATABASE: fleet_test
          JWT_SECRET: test-secret
          JWT_EXPIRATION: 3600
      - name: Run tests
        run: npm test -- --passWithNoTests
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USERNAME: postgres
          DB_PASSWORD: postgres
          DB_DATABASE: fleet_test
          JWT_SECRET: test-secret
          JWT_EXPIRATION: 3600

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3000/api/v1
      - name: Check bundle size
        run: |
          echo "Checking build output size..."
          du -sh .next/
          # Fail if the build output exceeds 200 MB (standalone includes node_modules)
          SIZE=$(du -sb .next/ | cut -f1)
          MAX_SIZE=$((200 * 1024 * 1024))
          if [ "$SIZE" -gt "$MAX_SIZE" ]; then
            echo "Build output too large: $(( SIZE / 1024 / 1024 )) MB (max: 200 MB)"
            exit 1
          fi
          echo "Build output size: $(( SIZE / 1024 / 1024 )) MB - OK"
      - name: Lighthouse CI
        if: github.event_name == 'pull_request'
        run: |
          npx @lhci/cli autorun --config=../.lighthouserc.js
        env:
          LHCI_BUILD_CONTEXT__currentBranch: ${{ github.head_ref }}
          LHCI_BUILD_CONTEXT__commitMessage: ${{ github.event.pull_request.title }}

  mobile:
    name: Mobile
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Mobile/fleet_mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.0"
          channel: stable
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test --no-pub
